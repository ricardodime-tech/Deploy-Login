<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Econômico - Painel de Ativos</title>
    
    <style>
        /* Variáveis de cor (Dark Mode) copiadas de grafico.html */
        :root {
            --bg: #0f1320;
            --card: #161b2e;
            --text: #e6e7ea;
            --muted: #a8adbd;
            --accent: #3b82f6;
        }
        
        * { box-sizing: border-box; }
        
        /* Estilos de corpo e HTML */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            display: flex; 
            flex-direction: column; /* Permite que o footer fique no final */
        }

        /* Contêiner principal, similar ao .container do grafico.html */
        .calendar-container {
            flex-grow: 1; /* Permite que o conteúdo principal ocupe o espaço */
            width: 100%;
            padding: 20px;
            max-width: 1360px;
            margin: 0 auto;
            display: flex; 
            align-items: stretch;
        }
        
        /* O "Card" que envolve o calendário */
        .calendar-card {
            background: var(--card);
            border: 1px solid #232946;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            width: 100%;
            height: 100%; 
            display: flex;
            flex-direction: column; 
        }

        /* Estilo do Cabeçalho do Card */
        .calendar-card header {
            padding: 10px 12px;
            border-bottom: 1px solid #232946;
        }
        .calendar-card header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
        }

        /* Contêiner principal do widget */
        #economicCalendarWidget {
            width: 100%;
            flex-grow: 1; 
            min-height: 500px; 
            overflow: auto;
        }

        /* Estilo para a seção de copyright do widget MQL5 (Rodapé do Card) */
        .ecw-copyright {
            padding: 10px 12px;
            border-top: 1px solid #232946;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Estilo do Rodapé Global (igual ao grafico.html) */
        footer {
            padding: 16px 20px 32px;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }
        footer p {
             margin: 0; /* Remove margens extras dos parágrafos no footer */
        }
        footer p:last-child {
            margin-top: 10px;
            font-size: 0.85em;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-card">
            <header>
                <h1>Calendário Econômico MQL5</h1>
            </header>
            
            <div id="economicCalendarWidget"></div>
            
            <div class="ecw-copyright"><a href="https://www.mql5.com/?utm_source=calendar.widget&utm_medium=link&utm_term=economic.calendar&utm_content=visit.mql5.calendar&utm_campaign=202.calendar.widget" rel="noopener nofollow" target="_blank">MQL5 Algo Trading Community</a></div>
        </div>
    </div>

    <script async type="text/javascript" data-type="calendar-widget" src="https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15">
        {"width":"100%","height":"100%","mode":"2","fw":"html","lang":"pt"}
    </script>
    
    <footer>
        <p>Atualização em tempo real • Dados dos principais eventos economicos mundiais</p>
        <p style="margin-top: 10px; font-size: 0.85em;">© 2025 - Informações fornecidas apenas para fins educacionais</p>
    </footer>
</body>
</html>
