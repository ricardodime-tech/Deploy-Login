<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Mercado Premium — Black & Gold</title>
  
  <style>
    :root {
      /* Degradê apenas no topo: cinza médio para branco */
      --bg-top: #1a1d33; 
      --bg-bottom: #1a1d23;
      --card-inner-bg: #ffffff;
      --header-dark: #1a1d23; 
      --muted: #ffffff;
      --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* Degradê linear ocupando apenas os primeiros 350px do topo */
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
      background-repeat: no-repeat;
      background-color: var(--bg-bottom);
      font-family: system-ui, -apple-system, sans-serif;
    }

    header { padding: 45px 20px 25px; text-align: center; }
    header h1 { 
      margin: 0 0 8px; 
      font-size: 2.6rem; 
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
      text-transform: uppercase;
      -webkit-text-stroke: 1.2px #000;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }
    header p { margin: 0; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px 32px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    .card {
      position: relative;
      background: var(--gold-gradient);
      border-radius: var(--radius);
      padding: 3px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-8px); }

    .card-inner {
      background: var(--card-inner-bg);
      border-radius: calc(var(--radius) - 3px);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card header {
      padding: 18px 15px;
      background: var(--header-dark);
      border-bottom: 2px solid #b38728; 
      text-align: center;
      box-shadow: inset 0 -5px 15px rgba(0,0,0,0.6);
    }

    .card header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 0.8px #000;
    }

    /* Botão da Lupa no canto superior esquerdo */
    .btn-zoom {
      position: absolute;
      top: 15px;
      left: 15px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      transition: transform 0.2s ease;
    }
    
    .btn-zoom:hover {
      transform: scale(1.2);
    }

    /* Ícone de Lupa de Zoom (+) em CSS Puro */
    .icon-lupa-zoom {
      width: 15px;
      height: 15px;
      border: 2.5px solid #bf953f;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Cabo da lupa */
    .icon-lupa-zoom::after {
      content: '';
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 2.5px;
      height: 7px;
      background: #bf953f;
      transform: rotate(-45deg);
      border-radius: 1px;
    }
    /* Sinal de mais (+) dentro da lupa */
    .icon-lupa-zoom::before {
      content: '+';
      color: #bf953f;
      font-size: 14px;
      font-weight: 900;
      font-family: sans-serif;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
    }

    .frame-wrap iframe {
      display: block;
      width: 100%;
      height: 480px;
      border: 0;
      background: #fff;
    }

    /* ---- Estilos da Janela Modal ---- */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto; 
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--gold-gradient);
      padding: 3px;
      border-radius: var(--radius);
      width: 806px; /* 800px do iframe + 6px de bordas */
      max-width: 95%;
      box-shadow: 0 5px 30px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease;
    }

    .modal-inner {
      background: var(--header-dark);
      border-radius: calc(var(--radius) - 3px);
      overflow: hidden;
    }

    .modal-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #b38728;
    }

    .modal-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .close-modal {
      color: #bf953f;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 20px;
    }

    .close-modal:hover {
      color: #fcf6ba;
    }

    .modal-body iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
      background: #fff;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    footer {
      padding: 80px 20px 40px;
      text-align: center;
      background: transparent;
    }

    .footer-content {
      display: inline-block;
      padding: 20px 40px;
      border-top: 1px solid rgba(191, 149, 63, 0.3);
    }

    .footer-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
      margin: 5px 0;
    }

    .footer-sub {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 10px;
      opacity: 0.8;
    }

    a { 
      color: inherit; 
      text-decoration: none; 
      border-bottom: 1px solid #bf953f;
    }
    
    @media (max-width: 720px) {
      .frame-wrap { height: 380px; }
      .grid { grid-template-columns: 1fr; }
      .modal-body iframe { height: 450px; }
    }
  </style>
</head>

  <script>
    const modal = document.getElementById('graphModal');
    const modalIframe = document.getElementById('modalIframe');
    const modalTitle = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('closeModal');
    const zoomButtons = document.querySelectorAll('.btn-zoom');

    zoomButtons.forEach(button => {
      button.addEventListener('click', function() {
        const cardInner = this.parentElement;
        const title = cardInner.querySelector('h2').innerText;
        const originalUrl = cardInner.querySelector('iframe').getAttribute('src');
        
        let modalUrl = originalUrl;
        if(modalUrl.includes('width=650') || modalUrl.includes('height=480')) {
          modalUrl = modalUrl.replace('width=650', 'width=800').replace('height=480', 'height=600');
        }

        modalTitle.innerText = title;
        modalIframe.setAttribute('src', modalUrl);
        modal.style.display = 'flex';
      });
    });

    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      modalIframe.setAttribute('src', '');
    });

    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.style.display = 'none';
        modalIframe.setAttribute('src', '');
      }
    });
  </script>
