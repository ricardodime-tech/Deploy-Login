<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Trader - Livros e Guias Recomendados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-top: #1a1d33; 
            --bg-bottom: #1a1d23;
            --text-primary: #e6e7ea;
            --text-secondary: #a8adbd;
            --card-inner-bg: #ffffff;
            --header-dark: #1a1d23;
            --shadow: 0 15px 35px rgba(0,0,0,0.25);
            --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --muted: #ffffff;
            --radius: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
            background-repeat: no-repeat;
            background-color: var(--bg-bottom);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin: 30px 0 40px;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #bf953f;
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #bf953f;
        }

        .filter-btn.active {
            background: var(--gold-gradient);
            border-color: transparent;
            color: #000;
            font-weight: 700;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .book-card {
            position: relative;
            background: var(--gold-gradient);
            border-radius: var(--radius);
            padding: 3px; 
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .book-card:hover {
            transform: translateY(-8px);
        }

        .book-card.hidden {
            display: none;
        }

        .card-inner {
            background: var(--card-inner-bg);
            border-radius: calc(var(--radius) - 3px);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .card-inner-header {
            margin: -20px -20px 15px -20px;
            padding: 15px;
            background: var(--header-dark);
            border-bottom: 2px solid #b38728; 
            text-align: center;
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.6);
        }

        .book-category {
            font-size: 0.75rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .image-container {
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 10px;
            background: #0f1117;
            margin-bottom: 15px;
        }

        .book-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .book-card:hover .book-image {
            transform: scale(1.03);
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1d23;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .book-author {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .btn-access {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin-top: auto;
            transition: opacity 0.3s ease;
            font-size: 1rem;
        }

        .btn-access:hover {
            opacity: 0.9;
        }

        /* Modal CSS Ajustado para Maior Largura */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            background-color: #1a1d23;
            border: 2px solid #b38728;
            border-radius: 15px;
            width: 95%; /* Expandido de 90% para 95% */
            max-width: 1400px; /* Expandido de 1100px para 1400px */
            height: 92vh; /* Leve ajuste de altura para melhor encaixe proporção */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 15px 20px;
            background: #0f1117;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(179, 135, 40, 0.4);
        }

        .modal-title {
            color: #e6e7ea;
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }

        .close-modal {
            color: var(--text-secondary);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-modal:hover {
            color: #bf953f;
        }

        .modal-body {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            padding: 60px 20px 40px;
            text-align: center;
            background: transparent;
        }

        .footer-content {
            display: inline-block;
            padding: 20px 40px;
            border-top: 1px solid rgba(191, 149, 63, 0.3);
        }

        .footer-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
            margin: 5px 0;
        }

        .footer-sub {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            opacity: 0.8;
        }

        @media (max-width: 992px) {
            .books-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 720px) {
            .books-grid { grid-template-columns: 1fr; }
            .modal-content {
                width: 98%;
                height: 96vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="page-title">Biblioteca do Trader</h1>
            <p class="page-subtitle">Principais guias, e-books e manuais de mercado financeiro</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar livro, autor ou tema...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="daytrade">Day Trade</button>
                <button class="filter-btn" data-filter="analise">Análise Técnica</button>
                <button class="filter-btn" data-filter="estrategias">Estratégias</button>
            </div>
        </div>

        <div class="books-grid" id="booksGrid"></div>

        <footer>
            <div class="footer-content">
                <div class="footer-text">Terminal Financeiro Day Trade</div>
                <div class="footer-sub">© 2026 • Ricardo Campos - Trader & Holder</div>
            </div>
        </footer>
    </div>

    <!-- Estrutura do Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" class="modal-title">Visualizando Documento</h3>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <iframe id="pdfFrame" src="" title="Visualizador de PDF"></iframe>
            </div>
        </div>
    </div>

    <script>
        const books = [
            {
                title: 'Day Trade',
                author: 'Portal do Investidor',
                category: 'daytrade',
                categoryLabel: 'Day Trade',
                image: 'https://i.ibb.co/mrJcB4Qt/01-Day-Trade-Autor-Portal-do-Investidor.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/01-Day-Trade-Autor-Portal-do-Investidor.pdf'
            },
            {
                title: 'Introdução ao Day Trade em Dólar e Índice Futuro',
                author: 'Escola de Operadores',
                category: 'daytrade',
                categoryLabel: 'Day Trade',
                image: 'https://i.ibb.co/RGmYWxNZ/02-Introducao-ao-day-trade-em-dolar-e-indice-futuro-escola-de-operadores.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/02-Introducao-ao-day-trade-em-dolar-e-indice-futuro-escola-de-operadores.pdf'
            },
            {
                title: 'Vivendo de Day Trade: A Trilha de Sucesso para Traders Iniciantes',
                author: 'Autor Independente',
                category: 'daytrade',
                categoryLabel: 'Day Trade',
                image: 'https://i.ibb.co/VYV0nvBb/03-Vivendo-de-day-trade-a-trilha-de-sucesso-para-traders-iniciantes.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/03-Vivendo-de-day-trade-a-trilha-de-sucesso-para-traders-iniciantes.pdf'
            },
            {
                title: 'Análise Técnica: Operando Através de Gráficos',
                author: 'Clear Corretora',
                category: 'analise',
                categoryLabel: 'Análise Técnica',
                image: 'https://i.ibb.co/1SCqWS1/04-Analise-tecnica-operando-atraves-de-graficos-clear-corretora.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/04-Analise-tecnica-operando-atraves-de-graficos-clear-corretora.pdf'
            },
            {
                title: 'Como Ser um Trader Profissional',
                author: 'Flash Trader',
                category: 'daytrade',
                categoryLabel: 'Day Trade',
                image: 'https://i.ibb.co/kg9bXtC8/05-Como-ser-um-trader-profissional-Autor-Flash-Trader.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/05-Como-ser-um-trader-profissional-Autor-Flash-Trader.pdf'
            },
            {
                title: 'Guia Básico de Análise Técnica',
                author: 'Guia do Mercado',
                category: 'analise',
                categoryLabel: 'Análise Técnica',
                image: 'https://i.ibb.co/GfqpbN0N/06-Guia-basico-de-analise-tecnica.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/06-Guia-basico-de-analise-tecnica.pdf'
            },
            {
                title: 'Guia do Trader: Saiba Tudo Sobre a Profissão',
                author: 'Modalmais',
                category: 'daytrade',
                categoryLabel: 'Day Trade',
                image: 'https://i.ibb.co/WvdFcrqG/07-Guia-do-trader-Saiba-tudo-sobre-a-profiss-o-Autor-Modalmais.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/07-Guia-do-trader-Saiba-tudo-sobre-a-profiss-o-Autor-Modalmais.pdf'
            },
            {
                title: '100 Dicas para o Trader',
                author: 'Leandro Martins',
                category: 'estrategias',
                categoryLabel: 'Estratégias',
                image: 'https://i.ibb.co/XrcJLvJp/08-100-Dicas-para-o-Trader-Autor-Leandro-Martins.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/08-100-Dicas-para-o-Trader-Autor-Leandro-Martins.pdf'
            },
            {
                title: 'Principais Sinais de Padrões de Candlestick',
                author: 'Trader Guide',
                category: 'analise',
                categoryLabel: 'Análise Técnica',
                image: 'https://i.ibb.co/j9jZN0m3/09-Principais-sinais-de-padroes-de-candlestick-trader.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/09-Principais-sinais-de-padroes-de-candlestick-trader.pdf'
            },
            {
                title: 'Eficazes Estratégias de Trading',
                author: 'Valutrades',
                category: 'estrategias',
                categoryLabel: 'Estratégias',
                image: 'https://i.ibb.co/Z6Lsr6xs/10-Eficaz-estrategias-valutrades.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/10-Eficaz-estrategias-valutrades.pdf'
            },
            {
                title: 'Estratégias Comerciais Forex',
                author: 'IFC Markets',
                category: 'estrategias',
                categoryLabel: 'Estratégias',
                image: 'https://i.ibb.co/1tMH8BbL/11-Estrategias-comerciais-forex-ifc-markets.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/11-Estrategias-comerciais-forex-ifc-markets.pdf'
            },
            {
                title: 'Como Funciona a Bolsa de Valores',
                author: 'Portal do Investidor',
                category: 'analise',
                categoryLabel: 'Bolsa de Valores',
                image: 'https://i.ibb.co/gLR5YjQc/12-Como-funciona-a-bolsa-de-valores-portal-do-investidor.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/12-Como-funciona-a-bolsa-de-valores-portal-do-investidor.pdf'
            },
            {
                title: 'Manual de Bolsa: Aprenda a Investir na Bolsa do Zero',
                author: 'Manual de Bolsa',
                category: 'analise',
                categoryLabel: 'Bolsa de Valores',
                image: 'https://i.ibb.co/zVgZ49dQ/13-Manual-de-bolsa-aprenda-a-investir-na-bolsa-do-zero.jpg',
                pdf: 'https://rictrade.vercel.app/estudo/13-Manual-de-bolsa-aprenda-a-investir-na-bolsa-do-zero.pdf'

                
            },

             {
                title: 'MQL5 Programming for Traders',
                author: 'Stanislav Korotkya',
                category: 'analise',
                categoryLabel: 'Bolsa de Valores',
                image: 'https://i.ibb.co/23RV9x3s/14-Mql5-programming-for-traders.png',
                pdf: 'https://rictrade.vercel.app/estudo/mql5book.pdf'
            },

             {
                title: 'Linguagem MQL5',
                author: 'MetaQuotes Software Corp.',
                category: 'analise',
                categoryLabel: 'Bolsa de Valores',
                image: 'https://i.ibb.co/sv3nFz3n/Linguagem-MQLR-Referente.png',
                pdf: 'https://rictrade.vercel.app/estudo/mql_portuguese.pdf'
            }






        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            books.forEach((book, index) => {
                const matchesSearch = searchTerm === '' || 
                    book.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    book.author.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesFilter = currentFilter === 'all' || book.category === currentFilter;

                const shouldShow = matchesSearch && matchesFilter;

                const card = document.createElement('div');
                card.className = `book-card ${!shouldShow ? 'hidden' : ''}`;
                card.style.animationDelay = `${index * 0.05}s`;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-inner-header">
                            <span class="book-category">${book.categoryLabel}</span>
                        </div>
                        <div class="image-container">
                            <img src="${book.image}" alt="${book.title}" class="book-image" loading="lazy">
                        </div>
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">Autor / Fonte: ${book.author}</div>
                        <button onclick="openModal('${book.pdf}', '${book.title.replace(/'/g, "\\'")}')" class="btn-access">Ler PDF</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Funções da Modal
        const modal = document.getElementById('pdfModal');
        const pdfFrame = document.getElementById('pdfFrame');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function openModal(pdfUrl, title) {
            modalTitle.textContent = title;
            pdfFrame.src = pdfUrl;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            pdfFrame.src = '';
            document.body.style.overflow = 'auto';
        }

        closeModalBtn.addEventListener('click', closeModal);

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderBooks();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderBooks();
            });
        });

        renderBooks();
    </script>
</body>
</html>
