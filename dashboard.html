<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro — Black & Gold</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Cores extraídas do grafico.html */
            --bg-top: #d1d5db; 
            --bg-bottom: #000000;
            --card-bg: #1a1d23;
            --text-primary: #e6e7ea;
            --text-secondary: #a8adbd;
            --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --nav-height: 70px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
            background-color: var(--bg-bottom);
            background-repeat: no-repeat;
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* NAVEGAÇÃO */
        nav {
            background: #1a1d23;
            border-bottom: 2px solid #bf953f; /* Borda dourada */
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--nav-height);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo img {
            height: 50px;
            transition: transform 0.3s ease;
          filter: drop-shadow(0 0 5px rgba(191, 149, 63, 0.5)); 
        }

        .nav-brand {
            font-size: 1.3rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1px;
            -webkit-text-stroke: 0.5px #000;
        }

        .nav-menu-and-indicator {
            display: flex;
            align-items: center; 
            gap: 10px; 
        }

        .payroll-label {
            color: #ff4d4d;
            font-weight: 800;
            font-size: 0.9rem;
            margin-right: 5px;
            display: none;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: block;
        }

        .status-indicator.default {
            background-color: #ffc107;
            animation: slow-blink 2s ease-in-out infinite alternate;
            box-shadow: 0 0 8px #ffc107;
        }

        .status-indicator.alert {
            background-color: #dc3545;
            animation: blink 0.8s step-start infinite;
            box-shadow: 0 0 10px #dc3545;
        }

        @keyframes blink { 50% { opacity: 0; } }
        @keyframes slow-blink { 0% { opacity: 1; } 100% { opacity: 0.4; } }

        .nav-menu {
            display: flex;
            gap: 8px;
            list-style: none;
            margin-right: 15px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: #fcf6ba;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link.active {
            background: var(--gold-gradient);
            color: #000; /* Texto preto no fundo dourado para contraste */
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.4);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: 1px solid #bf953f;
            color: #bf953f;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .nav-menu-and-indicator {
                position: fixed;
                top: var(--nav-height);
                left: -100%;
                width: 100%;
                height: calc(100vh - var(--nav-height));
                background: #1a1d23;
                flex-direction: column;
                padding: 30px;
                transition: left 0.3s ease;
                border-top: 2px solid #bf953f;
                display: none;
            }

            .nav-menu-and-indicator.active {
                left: 0;
                display: flex;
            }
            
            .nav-menu {
                flex-direction: column;
                width: 100%;
                margin-right: 0;
            }

            .nav-toggle { display: block; }

            .nav-link {
                width: 100%;
                text-align: center;
                padding: 15px;
                border-bottom: 1px solid rgba(191, 149, 63, 0.1);
            }
        }

        /* CONTEÚDO */
        .content-frame {
            width: 100%;
            height: calc(100vh - var(--nav-height));
            border: none;
            display: block;
            background: #ffffff; /* Fundo branco para os iframes não ficarem pretos antes de carregar */
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-logo">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPDs2PW6BfQv8WyN4dYA_LAP8BTk5_AUhHUg&s" alt="Logo B3">
                <span class="nav-brand"> Ric Trade Software </span>
            </div>
            
            <button class="nav-toggle" id="navToggle">☰</button>
            
            <div class="nav-menu-and-indicator">
                <ul class="nav-menu" id="navMenu">
                    <li><a href="#graficos" class="nav-link active" data-page="graficos">NYSE</a></li>
                    <li><a href="#graficosb3" class="nav-link" data-page="graficosb3">B3</a></li>
                    <li><a href="#cripto" class="nav-link" data-page="cripto">Cripto</a></li>
                    <li><a href="#horarios" class="nav-link" data-page="horarios">Bolsas</a></li>
                    <li><a href="#calendario" class="nav-link" data-page="calendario">Eventos</a></li>
                    <li><a href="#noticias" class="nav-link" data-page="noticias">Notícias</a></li>
                    <li><a href="#analise" class="nav-link" data-page="analise">Análise</a></li>
                    <li><a href="#pdf_arquivos" class="nav-link" data-page="pdf_arquivos">Resultados</a></li>

                    <li><a href="https://copilot.microsoft.com/" target="_blank" class="nav-link" data-page="inteligencia">IA</a></li>
                    <li><a href="/logout" class="nav-link" data-page="Sair">Logout</a></li>
                </ul>
                <span class="payroll-label" id="payrollLabel"></span>
                <span class="status-indicator" id="statusIndicator"></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-content active" id="graficos-page">
            <iframe src="grafico.html" class="content-frame" title="Gráficos e Calendário"></iframe>
        </div>
        
        <div class="page-content" id="graficosb3-page">
            <iframe src="graficob3.html" class="content-frame" title="Gráficos B3"></iframe>
        </div>
        <div class="page-content" id="horarios-page">
            <iframe src="hora_bolsa.html" class="content-frame" title="Horários das Bolsas"></iframe>
        </div>
        
        <div class="page-content" id="pdf_arquivos-page">
            <iframe src="pdf_arquivos.html" class="content-frame" title="Balanço Empresarial"></iframe>
        </div>

        <div class="page-content" id="cripto-page">
            <iframe src="cripto.html" class="content-frame" title="Cotações de Criptomoedas"></iframe>
        </div>

        <div class="page-content" id="calendario-page">
            <iframe src="calendario.html" class="content-frame" title="Calendário Econômico"></iframe>
        </div>

        <div class="page-content" id="noticias-page">
            <iframe src="noticias.html" class="content-frame" title="Notícias"></iframe>
        </div>

        <div class="page-content" id="analise-page">
            <iframe src="analise.html" class="content-frame" title="Análises"></iframe>
        </div>

        <div class="page-content" id="inteligencia-page">
            <iframe src="https://gemini.google.com/app?hl=pt-BR" class="content-frame" title="IA"></iframe>
        </div>

        </main>

    <script>
        const navLinks = document.querySelectorAll('.nav-link');
        const navToggle = document.getElementById('navToggle');
        const navMenuContainer = document.querySelector('.nav-menu-and-indicator'); 
        const pages = document.querySelectorAll('.page-content');
        const statusIndicator = document.getElementById('statusIndicator');
        const payrollLabel = document.getElementById('payrollLabel');

        function isFirstFridayOfMonth() {
            const today = new Date();
            const dayOfMonth = today.getDate();
            const dayOfWeek = today.getDay();
            if (dayOfWeek !== 5) return false;
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            let firstDayOfWeek = firstDayOfMonth.getDay();
            const firstFridayDate = (5 - firstDayOfWeek + 7) % 7 + 1;
            return dayOfMonth === firstFridayDate;
        }

        function updateStatusIndicator() {
            if (isFirstFridayOfMonth()) {
                statusIndicator.classList.remove('default');
                statusIndicator.classList.add('alert');
                payrollLabel.textContent = 'PAYROLL';
                payrollLabel.style.display = 'block';
            } else {
                statusIndicator.classList.remove('alert');
                statusIndicator.classList.add('default');
                payrollLabel.style.display = 'none';
            }
        }

        updateStatusIndicator();

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                const targetPage = link.dataset.page;

                // CORREÇÃO: Permite que o link de logout e o da IA sigam o comportamento padrão (redirecionar/abrir nova aba)
                if (targetPage === 'inteligencia' || targetPage === 'Sair') {
                    return; 
                }
                
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                pages.forEach(page => {
                    page.classList.toggle('active', page.id === `${targetPage}-page`);
                });
                if (window.innerWidth <= 768) navMenuContainer.classList.remove('active');
                window.history.pushState({}, '', `#${targetPage}`);
            });
        });

        navToggle.addEventListener('click', () => {
            navMenuContainer.classList.toggle('active'); 
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!navMenuContainer.contains(e.target) && !navToggle.contains(e.target)) {
                    navMenuContainer.classList.remove('active');
                }
            }
        });

        window.addEventListener('load', () => {
            const hash = window.location.hash.substring(1);
            if (hash && ['graficos', 'graficosb3', 'horarios', 'pdf_arquivos', 'cripto', 'calendario', 'inteligencia'].includes(hash)) {
                const targetLink = document.querySelector(`[data-page="${hash}"]`);
                if (targetLink) targetLink.click();
            }
        });
    </script>
</body>
</html>
