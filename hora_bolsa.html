<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógios das Bolsas de Valores Mundiais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f1320;
            --bg-secondary: #1a1f35;
            --text-primary: #e6e7ea;
            --text-secondary: #a8adbd;
            --accent-blue: #667eea;
            --accent-purple: #764ba2;
            --card-bg: rgba(255, 255, 255, 0.98);
            --success-bg: #d4edda;
            --success-text: #155724;
            --danger-bg: #f8d7da;
            --danger-text: #721c24;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .logo-b3 {
            height: 70px;
            filter: brightness(1.1);
            transition: transform 0.3s ease;
        }

        .logo-b3:hover {
            transform: scale(1.05);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            margin: 8px 0;
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-color: transparent;
            color: white;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .clock-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .clock-card.hidden {
            display: none;
        }

        .exchange-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 8px;
        }

        .flag-icon {
            width: 56px;
            height: 42px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .exchange-name {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }

        .city-name {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .time-display {
            font-size: 3.2em;
            font-weight: 700;
            color: var(--accent-blue);
            text-align: center;
            margin: 25px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .date-display {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 1em;
            text-transform: capitalize;
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status.open {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.closed {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .trading-hours {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: 12px;
            font-weight: 500;
        }

        .countdown {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-top: 8px;
            font-style: italic;
        }

        footer {
            padding: 30px 20px;
            color: var(--text-secondary);
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.4rem;
            }
            
            .time-display {
                font-size: 2.5em;
            }

            .logo-title {
                flex-direction: column;
                align-items: flex-start;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            </header>

        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <div class="tradingview-widget-copyright"><a href="https://br.tradingview.com/markets/" rel="noopener nofollow" target="_blank"><span class="blue-text">                                        </span></a></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
                "symbols": [
                    {
                        "proName": "COINBASE:BTCUSD",
                        "title": ""
                    },
                    {
                        "proName": "COINBASE:ETHUSD",
                        "title": ""
                    },
                    {
                        "proName": "COINBASE:XRPUSD",
                        "title": ""
                    },
                    {
                        "proName": "ACTIVTRADES:USDBRL",
                        "title": ""
                    },
                    {
                        "proName": "NYSE:VALE",
                        "title": ""
                    },
                    {
                        "proName": "NYSE:ITUB",
                        "title": ""
                    },
                    {
                        "proName": "NYSE:PBR.A",
                        "title": ""
                    },
                    {
                        "proName": "NYSE:BBD",
                        "title": ""
                    }
                ],
                "colorTheme": "dark",
                "locale": "br",
                "largeChartUrl": "",
                "isTransparent": true,
                "showSymbolLogo": true,
                "displayMode": "adaptive"
            }
            </script>
        </div>
        <div class="controls">
            <div class="search-box">
                <input type="text" 
                       id="searchInput" 
                       placeholder="🔍 Buscar bolsa ou cidade...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="open">Abertas</button>
                <button class="filter-btn" data-filter="closed">Fechadas</button>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid"></div>

        <footer>
            <p>Atualização em tempo real • Dados de horários de negociação das principais bolsas mundiais</p>
            <p style="margin-top: 10px; font-size: 0.85em;">© 2025 - Informações fornecidas apenas para fins educacionais</p>
        </footer>
    </div>

    <script>
        const exchanges = [
            {
                name: 'NYSE',
                city: 'Nova York, EUA',
                flagCode: 'us',
                timezone: 'America/New_York',
                openHour: 9,
                openMinute: 30,
                closeHour: 16,
                closeMinute: 0,
                tradingHours: '9:30 - 16:00'
            },
            {
                name: 'NASDAQ',
                city: 'Nova York, EUA',
                flagCode: 'us',
                timezone: 'America/New_York',
                openHour: 9,
                openMinute: 30,
                closeHour: 16,
                closeMinute: 0,
                tradingHours: '9:30 - 16:00'
            },
            {
                name: 'B3',
                city: 'São Paulo, Brasil',
                flagCode: 'br',
                timezone: 'America/Sao_Paulo',
                openHour: 10,
                openMinute: 0,
                closeHour: 18,
                closeMinute: 0,
                tradingHours: '10:00 - 18:00'
            },
            {
                name: 'LSE',
                city: 'Londres, Reino Unido',
                flagCode: 'gb',
                timezone: 'Europe/London',
                openHour: 8,
                openMinute: 0,
                closeHour: 16,
                closeMinute: 30,
                tradingHours: '8:00 - 16:30'
            },
            {
                name: 'Euronext',
                city: 'Paris, França',
                flagCode: 'fr',
                timezone: 'Europe/Paris',
                openHour: 9,
                openMinute: 0,
                closeHour: 17,
                closeMinute: 30,
                tradingHours: '9:00 - 17:30'
            },
            {
                name: 'Frankfurt',
                city: 'Frankfurt, Alemanha',
                flagCode: 'de',
                timezone: 'Europe/Berlin',
                openHour: 9,
                openMinute: 0,
                closeHour: 17,
                closeMinute: 30,
                tradingHours: '9:00 - 17:30'
            },
            {
                name: 'TSE',
                city: 'Tóquio, Japão',
                flagCode: 'jp',
                timezone: 'Asia/Tokyo',
                openHour: 9,
                openMinute: 0,
                closeHour: 15,
                closeMinute: 0,
                tradingHours: '9:00 - 15:00'
            },
            {
                name: 'SSE',
                city: 'Xangai, China',
                flagCode: 'cn',
                timezone: 'Asia/Shanghai',
                openHour: 9,
                openMinute: 30,
                closeHour: 15,
                closeMinute: 0,
                tradingHours: '9:30 - 15:00'
            },
            {
                name: 'HKEX',
                city: 'Hong Kong',
                flagCode: 'hk',
                timezone: 'Asia/Hong_Kong',
                openHour: 9,
                openMinute: 30,
                closeHour: 16,
                closeMinute: 0,
                tradingHours: '9:30 - 16:00'
            }
        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function isMarketOpen(exchange, now) {
            const day = now.getDay();
            if (day === 0 || day === 6) return false;

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const openMinutes = exchange.openHour * 60 + exchange.openMinute;
            const closeMinutes = exchange.closeHour * 60 + exchange.closeMinute;

            return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
        }

        function getTimeUntilEvent(exchange, now) {
            const day = now.getDay();
            if (day === 0 || day === 6) {
                return 'Fechado nos finais de semana';
            }

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const openMinutes = exchange.openHour * 60 + exchange.openMinute;
            const closeMinutes = exchange.closeHour * 60 + exchange.closeMinute;

            if (currentMinutes < openMinutes) {
                const diff = openMinutes - currentMinutes;
                const hours = Math.floor(diff / 60);
                const mins = diff % 60;
                return `Abre em ${hours}h ${mins}min`;
            } else if (currentMinutes < closeMinutes) {
                const diff = closeMinutes - currentMinutes;
                const hours = Math.floor(diff / 60);
                const mins = diff % 60;
                return `Fecha em ${hours}h ${mins}min`;
            } else {
                return 'Mercado fechado';
            }
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            
            // Apenas atualiza os cards existentes ao invés de recriar tudo
            const existingCards = grid.querySelectorAll('.clock-card');
            
            if (existingCards.length === 0) {
                // Primeira renderização - cria os cards
                createAllCards();
            } else {
                // Atualiza apenas o conteúdo dos cards existentes
                updateCardContents();
            }
        }

        function createAllCards() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            exchanges.forEach((exchange, index) => {
                const now = new Date(new Date().toLocaleString('pt-BR', { timeZone: exchange.timezone }));
                
                const timeString = now.toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    timeZone: exchange.timezone
                });

                const dateString = now.toLocaleDateString('pt-BR', {
                    weekday: 'long',
                    day: '2-digit',
                    month: 'long',
                    timeZone: exchange.timezone
                });

                const isOpen = isMarketOpen(exchange, now);
                const countdown = getTimeUntilEvent(exchange, now);

                const matchesSearch = searchTerm === '' || 
                    exchange.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    exchange.city.toLowerCase().includes(searchTerm.toLowerCase());

                const matchesFilter = currentFilter === 'all' ||
                    (currentFilter === 'open' && isOpen) ||
                    (currentFilter === 'closed' && !isOpen);

                const shouldShow = matchesSearch && matchesFilter;

                const card = document.createElement('div');
                card.className = `clock-card ${!shouldShow ? 'hidden' : ''}`;
                card.style.animationDelay = `${index * 0.1}s`;
                card.dataset.exchangeName = exchange.name;
                
                const flagUrl = `https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/flags/4x3/${exchange.flagCode}.svg`;
                
                card.innerHTML = `
                    <div class="exchange-header">
                        <img src="${flagUrl}" alt="${exchange.city}" class="flag-icon" loading="lazy">
                        <div class="exchange-name">${exchange.name}</div>
                    </div>
                    <div class="city-name">${exchange.city}</div>
                    <div class="time-display" data-field="time">${timeString}</div>
                    <div class="date-display" data-field="date">${dateString}</div>
                    <div class="status ${isOpen ? 'open' : 'closed'}" data-field="status">
                        <span>${isOpen ? '🟢' : '🔴'}</span>
                        <span>${isOpen ? 'MERCADO ABERTO' : 'MERCADO FECHADO'}</span>
                    </div>
                    <div class="trading-hours">
                        Horário de negociação: ${exchange.tradingHours}
                    </div>
                    <div class="countdown" data-field="countdown">${countdown}</div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCardContents() {
            exchanges.forEach((exchange, index) => {
                const card = document.querySelector(`[data-exchange-name="${exchange.name}"]`);
                if (!card) return;

                const now = new Date(new Date().toLocaleString('en-US', { timeZone: exchange.timezone }));
                
                const timeString = now.toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    timeZone: exchange.timezone
                });

                const dateString = now.toLocaleDateString('pt-BR', {
                    weekday: 'long',
                    day: '2-digit',
                    month: 'long',
                    timeZone: exchange.timezone
                });

                const isOpen = isMarketOpen(exchange, now);
                const countdown = getTimeUntilEvent(exchange, now);

                const matchesSearch = searchTerm === '' || 
                    exchange.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    exchange.city.toLowerCase().includes(searchTerm.toLowerCase());

                const matchesFilter = currentFilter === 'all' ||
                    (currentFilter === 'open' && isOpen) ||
                    (currentFilter === 'closed' && !isOpen);

                const shouldShow = matchesSearch && matchesFilter;

                // Atualiza apenas o que mudou
                card.classList.toggle('hidden', !shouldShow);
                
                const timeDisplay = card.querySelector('[data-field="time"]');
                if (timeDisplay && timeDisplay.textContent !== timeString) {
                    timeDisplay.textContent = timeString;
                }

                const dateDisplay = card.querySelector('[data-field="date"]');
                if (dateDisplay && dateDisplay.textContent !== dateString) {
                    dateDisplay.textContent = dateString;
                }

                const statusDisplay = card.querySelector('[data-field="status"]');
                const newStatusClass = isOpen ? 'open' : 'closed';
                if (statusDisplay && !statusDisplay.classList.contains(newStatusClass)) {
                    statusDisplay.className = `status ${newStatusClass}`;
                    statusDisplay.innerHTML = `
                        <span>${isOpen ? '🟢' : '🔴'}</span>
                        <span>${isOpen ? 'MERCADO ABERTO' : 'MERCADO FECHADO'}</span>
                    `;
                }

                const countdownDisplay = card.querySelector('[data-field="countdown"]');
                if (countdownDisplay && countdownDisplay.textContent !== countdown) {
                    countdownDisplay.textContent = countdown;
                }
            });
        }
        
        // Busca
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            updateCardContents();
        });

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                updateCardContents();
            });
        });

        // Inicializa
        createAllCards();
        setInterval(updateClocks, 1000); // Atualiza os relógios a cada 1 segundo
        
    </script>
</body>
</html>
