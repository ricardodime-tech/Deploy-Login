<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógios das Bolsas de Valores Mundiais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-top: #1a1d33; 
            --bg-bottom: #1a1d23;
            --text-primary: #e6e7ea;
            --text-secondary: #a8adbd;
            --accent-blue: #667eea;
            --accent-purple: #764ba2;
            --card-inner-bg: #ffffff;
            --header-dark: #1a1d23;
            --success-bg: #d4edda;
            --success-text: #155724;
            --danger-bg: #f8d7da;
            --danger-text: #721c24;
            --shadow: 0 15px 35px rgba(0,0,0,0.15);
            --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --muted: #ffffff;
            --radius: 20px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
            background-repeat: no-repeat;
            background-color: var(--bg-bottom);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #bf953f;
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #bf953f;
        }

        .filter-btn.active {
            background: var(--gold-gradient);
            border-color: transparent;
            color: #000;
            font-weight: 700;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .clock-card {
            position: relative;
            background: var(--gold-gradient);
            border-radius: var(--radius);
            padding: 3px; 
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .clock-card:hover {
            transform: translateY(-8px);
        }

        .clock-card.hidden {
            display: none;
        }

        .card-inner {
            background: var(--card-inner-bg);
            border-radius: calc(var(--radius) - 3px);
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .card-inner-header {
            margin: -25px -25px 20px -25px;
            padding: 18px 15px;
            background: var(--header-dark);
            border-bottom: 2px solid #b38728; 
            text-align: center;
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .flag-icon {
            width: 40px;
            height: 28px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .exchange-name {
            font-size: 1.2rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            -webkit-text-stroke: 0.5px #000;
        }

        .city-name {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .time-display {
            font-size: 2.8em;
            font-weight: 700;
            color: #1a1d23;
            text-align: center;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .date-display {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 0.95em;
            text-transform: capitalize;
            font-weight: 500;
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            margin-top: auto;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status.open {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.closed {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .trading-hours {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-top: 12px;
            font-weight: 600;
        }

        .countdown {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-top: 6px;
            font-style: italic;
        }

        footer {
            padding: 80px 20px 40px;
            text-align: center;
            background: transparent;
        }

        .footer-content {
            display: inline-block;
            padding: 20px 40px;
            border-top: 1px solid rgba(191, 149, 63, 0.3);
        }

        .footer-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
            margin: 5px 0;
        }

        .footer-sub {
            color: var(--muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            opacity: 0.8;
        }

        a { 
            color: inherit; 
            text-decoration: none; 
            border-bottom: 1px solid #bf953f;
        }
        
        @media (max-width: 992px) {
            .clocks-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 720px) {
            .clocks-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header></header>

        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <div class="tradingview-widget-copyright"><a href="https://br.tradingview.com/markets/" rel="noopener nofollow" target="_blank"><span class="blue-text">                                        </span></a></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
                "symbols": [
                    { "proName": "COINBASE:BTCUSD", "title": "" },
                    { "proName": "COINBASE:ETHUSD", "title": "" },
                    { "proName": "COINBASE:XRPUSD", "title": "" },
                    { "proName": "ACTIVTRADES:USDBRL", "title": "" },
                    { "proName": "NYSE:VALE", "title": "" },
                    { "proName": "NYSE:ITUB", "title": "" },
                    { "proName": "NYSE:PBR.A", "title": "" },
                    { "proName": "NYSE:BBD", "title": "" }
                ],
                "colorTheme": "dark",
                "locale": "br",
                "largeChartUrl": "",
                "isTransparent": true,
                "showSymbolLogo": true,
                "displayMode": "adaptive"
            }
            </script>
        </div>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar bolsa ou cidade...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="open">Abertas</button>
                <button class="filter-btn" data-filter="closed">Fechadas</button>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid"></div>

        <footer>
            <div class="footer-content">
                <div class="footer-text">Terminal Financeiro Day trade</div>
                <div class="footer-sub">© 2026 • Ricardo Campos - Trader & Holder</div>
            </div>
        </footer>
    </div>

    <script>
        const exchanges = [
            { name: 'B3', city: 'São Paulo, Brasil', flagCode: 'br', timezone: 'America/Sao_Paulo', openHour: 10, openMinute: 0, closeHour: 18, closeMinute: 0, tradingHours: '10:00 - 18:00' },
            { name: 'NYSE', city: 'Nova York, EUA', flagCode: 'us', timezone: 'America/New_York', openHour: 9, openMinute: 30, closeHour: 16, closeMinute: 0, tradingHours: '9:30 - 16:00' },
            { name: 'NASDAQ', city: 'Nova York, EUA', flagCode: 'us', timezone: 'America/New_York', openHour: 9, openMinute: 30, closeHour: 16, closeMinute: 0, tradingHours: '9:30 - 16:00' },
            { name: 'Coinbase', city: 'Criptomoedas (Global)', isCrypto: true, flagUrl: 'https://cryptoicons.org/api/icon/btc/200', timezone: 'America/New_York', is24_7: true, tradingHours: '24/7 (Segunda a Segunda)' },
            { name: 'LSE', city: 'Londres, Reino Unido', flagCode: 'gb', timezone: 'Europe/London', openHour: 8, openMinute: 0, closeHour: 16, closeMinute: 30, tradingHours: '8:00 - 16:30' },
            { name: 'Euronext', city: 'Paris, França', flagCode: 'fr', timezone: 'Europe/Paris', openHour: 9, openMinute: 0, closeHour: 17, closeMinute: 30, tradingHours: '9:00 - 17:30' },
            { name: 'Frankfurt', city: 'Frankfurt, Alemanha', flagCode: 'de', timezone: 'Europe/Berlin', openHour: 9, openMinute: 0, closeHour: 17, closeMinute: 30, tradingHours: '9:00 - 17:30' },
            { name: 'TSE', city: 'Tóquio, Japão', flagCode: 'jp', timezone: 'Asia/Tokyo', openHour: 9, openMinute: 0, closeHour: 15, closeMinute: 0, tradingHours: '9:00 - 15:00' },
            { name: 'SSE', city: 'Xangai, China', flagCode: 'cn', timezone: 'Asia/Shanghai', openHour: 9, openMinute: 30, closeHour: 15, closeMinute: 0, tradingHours: '9:30 - 15:00' },
            { name: 'HKEX', city: 'Hong Kong', flagCode: 'hk', timezone: 'Asia/Hong_Kong', openHour: 9, openMinute: 30, closeHour: 16, closeMinute: 0, tradingHours: '9:30 - 16:00' },
            { name: 'ASX', city: 'Sydney, Austrália', flagCode: 'au', timezone: 'Australia/Sydney', openHour: 10, openMinute: 0, closeHour: 16, closeMinute: 0, tradingHours: '10:00 - 16:00' },
            { name: 'TSX', city: 'Toronto, Canadá', flagCode: 'ca', timezone: 'America/Toronto', openHour: 9, openMinute: 30, closeHour: 16, closeMinute: 0, tradingHours: '9:30 - 16:00' }
        ];

        let currentFilter = 'all';
        let searchTerm = '';

        function isMarketOpen(exchange, now) {
            if (exchange.is24_7) return true;
            
            const day = now.getDay();
            if (day === 0 || day === 6) return false;
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const openMinutes = exchange.openHour * 60 + exchange.openMinute;
            const closeMinutes = exchange.closeHour * 60 + exchange.closeMinute;
            return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
        }

        function getTimeUntilEvent(exchange, now) {
            if (exchange.is24_7) return 'Ininterrupto 24/7';

            const day = now.getDay();
            if (day === 0 || day === 6) return 'Fechado nos finais de semana';
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const openMinutes = exchange.openHour * 60 + exchange.openMinute;
            const closeMinutes = exchange.closeHour * 60 + exchange.closeMinute;

            if (currentMinutes < openMinutes) {
                const diff = openMinutes - currentMinutes;
                return `Abre em ${Math.floor(diff / 60)}h ${diff % 60}min`;
            } else if (currentMinutes < closeMinutes) {
                const diff = closeMinutes - currentMinutes;
                return `Fecha em ${Math.floor(diff / 60)}h ${diff % 60}min`;
            } else {
                return 'Mercado fechado';
            }
        }

        function getFlagUrl(exchange) {
            if (exchange.flagUrl) return exchange.flagUrl;
            return `https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/flags/4x3/${exchange.flagCode}.svg`;
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            if (grid.querySelectorAll('.clock-card').length === 0) {
                createAllCards();
            } else {
                updateCardContents();
            }
        }

        function createAllCards() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            exchanges.forEach((exchange, index) => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: exchange.timezone });
                const dateString = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', timeZone: exchange.timezone });
                const localNow = new Date(now.toLocaleString('en-US', { timeZone: exchange.timezone }));
                const isOpen = isMarketOpen(exchange, localNow);
                const countdown = getTimeUntilEvent(exchange, localNow);

                const shouldShow = (searchTerm === '' || exchange.name.toLowerCase().includes(searchTerm.toLowerCase()) || exchange.city.toLowerCase().includes(searchTerm.toLowerCase())) &&
                                   (currentFilter === 'all' || (currentFilter === 'open' && isOpen) || (currentFilter === 'closed' && !isOpen));

                const card = document.createElement('div');
                card.className = `clock-card ${!shouldShow ? 'hidden' : ''}`;
                card.style.animationDelay = `${index * 0.1}s`;
                card.dataset.exchangeName = exchange.name;
                
                const flagUrl = getFlagUrl(exchange);
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-inner-header">
                            <img src="${flagUrl}" alt="${exchange.city}" class="flag-icon" loading="lazy">
                            <div class="exchange-name">${exchange.name}</div>
                        </div>
                        <div class="city-name">${exchange.city}</div>
                        <div class="time-display" data-field="time">${timeString}</div>
                        <div class="date-display" data-field="date">${dateString}</div>
                        <div class="status ${isOpen ? 'open' : 'closed'}" data-field="status">
                            <span>${isOpen ? '🟢' : '🔴'}</span>
                            <span>${isOpen ? 'MERCADO ABERTO' : 'MERCADO FECHADO'}</span>
                        </div>
                        <div class="trading-hours">Horário de negociação: ${exchange.tradingHours}</div>
                        <div class="countdown" data-field="countdown">${countdown}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCardContents() {
            exchanges.forEach((exchange) => {
                const card = document.querySelector(`[data-exchange-name="${exchange.name}"]`);
                if (!card) return;

                const now = new Date();
                const timeString = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: exchange.timezone });
                const dateString = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', timeZone: exchange.timezone });
                const localNow = new Date(now.toLocaleString('en-US', { timeZone: exchange.timezone }));
                const isOpen = isMarketOpen(exchange, localNow);
                const countdown = getTimeUntilEvent(exchange, localNow);

                const shouldShow = (searchTerm === '' || exchange.name.toLowerCase().includes(searchTerm.toLowerCase()) || exchange.city.toLowerCase().includes(searchTerm.toLowerCase())) &&
                                   (currentFilter === 'all' || (currentFilter === 'open' && isOpen) || (currentFilter === 'closed' && !isOpen));

                card.classList.toggle('hidden', !shouldShow);
                
                const timeDisplay = card.querySelector('[data-field="time"]');
                if (timeDisplay && timeDisplay.textContent !== timeString) timeDisplay.textContent = timeString;

                const dateDisplay = card.querySelector('[data-field="date"]');
                if (dateDisplay && dateDisplay.textContent !== dateString) dateDisplay.textContent = dateString;

                const statusDisplay = card.querySelector('[data-field="status"]');
                const newStatusClass = isOpen ? 'open' : 'closed';
                if (statusDisplay && !statusDisplay.classList.contains(newStatusClass)) {
                    statusDisplay.className = `status ${newStatusClass}`;
                    statusDisplay.innerHTML = `<span>${isOpen ? '🟢' : '🔴'}</span><span>${isOpen ? 'MERCADO ABERTO' : 'MERCADO FECHADO'}</span>`;
                }

                const countdownDisplay = card.querySelector('[data-field="countdown"]');
                if (countdownDisplay && countdownDisplay.textContent !== countdown) countdownDisplay.textContent = countdown;
            });
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; updateCardContents(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                updateCardContents();
            });
        });

        createAllCards();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
