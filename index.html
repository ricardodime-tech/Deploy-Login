<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard Field Foundation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset e Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7f9;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .signup-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Lado Visual (Carrossel) */
        .visual-side {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            display: none; /* Escondido no mobile por padrão */
        }

        @media (min-width: 768px) {
            .visual-side { display: block; }
        }

        .carousel-container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        .carousel-track {
            height: 100%;
            width: 100%;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-caption {
            position: absolute;
            bottom: 50px;
            left: 50px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            max-width: 80%;
        }

        /* Lado do Formulário */
        .form-side {
            flex: 1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        /* Ajuste da Imagem/Logo */
        .brand-logo {
            display: block;
            margin: 0 auto 30px auto;
            max-height: 200px;
            width: auto;
            object-fit: contain;
        }

        header h2 {
            margin-bottom: 25px;
            font-size: 24px;
            color: #1a1a1a;
            text-align: center;
        }

        /* Grupos de Input */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* Checkbox de Termos */
        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Botão Principal */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Toggle de Login/Cadastro */
        .auth-toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .auth-toggle-text a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }

        /* Botões do Carrossel */
        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 15px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
        }

        .prev { left: 20px; }
        .next { right: 20px; }
    </style>
</head>
<body>
    <main class="signup-container">
        <section class="visual-side">
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-slide active">
                        <img src="https://e0.pxfuel.com/wallpapers/813/356/desktop-wallpaper-wall-street-and-new-york-stock-exchange-nyse-joergen.jpg" alt="Bolsa de Valores 1">
                        <div class="carousel-caption">
                            <h2>Insights de Mercado em Tempo Real</h2>
                            <p>Mantenha-se atualizado com as últimas tendências financeiras.</p>
                        </div>
                    </div>
                    <div class="carousel-slide">
                        <img src="https://cdn.borainvestir.b3.com.br/2022/07/22181302/comofuncionaabolsadevaloresdobrasil.jpg.webp" alt="Bolsa de Valores 2">
                        <div class="carousel-caption">
                            <h2>Invista com Confiança</h2>
                            <p>Ferramentas robustas para gerenciar seu portfólio.</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-button prev">&#10094;</button>
                <button class="carousel-button next">&#10095;</button>
            </div>
        </section>

        <section class="form-side">
            <div class="form-wrapper">
                <img src="https://i.ibb.co/Sw3d4kBw/Chat-GPT-Image-12-de-jan-de-2026-02-21-00.jpg" class="brand-logo" alt="Logo Foundation">
                
                <header>
                    <h2 id="formTitle">Bem-vindo de volta</h2>
                </header>

                <form id="authForm" method="POST" action="/login">
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Sua senha" required>
                    </div>

                    <div class="terms" id="terms-container" style="display: none;">
                        <input type="checkbox" id="terms">
                        <label for="terms">Eu concordo com os <a href="#">Termos de Uso</a></label>
                    </div>

                    <button type="submit" id="mainBtn" class="btn-primary">Entrar</button>
                    
                    <p class="auth-toggle-text">
                        <span id="toggleText">Não tem uma conta?</span> 
                        <a href="javascript:void(0)" id="toggleAuth">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script>
        // Lógica de Alternância Login/Cadastro
        const authForm = document.getElementById('authForm');
        const mainBtn = document.getElementById('mainBtn');
        const toggleAuth = document.getElementById('toggleAuth');
        const toggleText = document.getElementById('toggleText');
        const termsContainer = document.getElementById('terms-container');
        const formTitle = document.getElementById('formTitle');

        toggleAuth.addEventListener('click', () => {
            const isLogin = authForm.action.includes('/login');
            
            if (isLogin) {
                authForm.action = '/signup';
                formTitle.innerText = 'Crie sua conta';
                mainBtn.innerText = 'Criar minha conta';
                toggleText.innerText = 'Já tem uma conta?';
                toggleAuth.innerText = 'Faça login';
                termsContainer.style.display = 'flex';
            } else {
                authForm.action = '/login';
                formTitle.innerText = 'Bem-vindo de volta';
                mainBtn.innerText = 'Entrar';
                toggleText.innerText = 'Não tem uma conta?';
                toggleAuth.innerText = 'Cadastre-se';
                termsContainer.style.display = 'none';
            }
        });

        // Lógica básica do Carrossel
        const slides = document.querySelectorAll('.carousel-slide');
        let currentSlide = 0;

        function showSlide(index) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        document.querySelector('.next').addEventListener('click', () => showSlide(currentSlide + 1));
        document.querySelector('.prev').addEventListener('click', () => showSlide(currentSlide - 1));

        // Auto play opcional
        setInterval(() => showSlide(currentSlide + 1), 5000);
    </script>
</body>
</html>
