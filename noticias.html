<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed de Notícias Financeiras — InfoMoney</title>
  
  <style>
    :root {
      /* Cores do painel original */
      --bg-top: #1a1d33; 
      --bg-bottom: #1a1d23;
      --text-secondary: #a8adbd;
      --muted: #ffffff;
      --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    }

    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* Degradê linear do topo igual ao gráfico */
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
      background-repeat: no-repeat;
      background-color: var(--bg-bottom);
      font-family: system-ui, -apple-system, sans-serif;
    }

    header { padding: 45px 20px 25px; text-align: center; }
    header h1 { 
      margin: 0 0 8px; 
      font-size: 2.6rem; 
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
      text-transform: uppercase;
      -webkit-text-stroke: 1.2px #000;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .page-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

    .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            text-transform: none;
        }

    /* Estilo do Botão de Atualizar */
    .refresh-btn {
      background: var(--gold-gradient);
      border: none;
      color: #1a1d23;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(179, 135, 40, 0.4);
    }

    .refresh-btn:active {
      transform: translateY(0);
    }

    .container { max-width: 800px; margin: 0 auto; padding: 16px 20px 32px; }
    
    /* Layout das notícias estruturado sem as bordas ou cores douradas */
    .news-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .news-item {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Títulos normais, sem efeito dourado */
    .news-item h2 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #1a1d23;
      font-weight: 700;
      line-height: 1.4;
    }

    .news-item p {
      font-size: 13px;
      color: #666;
      margin: 0 0 15px 0;
    }

    /* Link padrão discreto */
    .news-item a {
      text-decoration: none;
      color: #b38728;
      font-weight: bold;
      font-size: 14px;
      transition: color 0.2s;
    }

    .news-item a:hover {
      color: #bf953f;
      text-decoration: underline;
    }

    footer {
      padding: 80px 20px 40px;
      text-align: center;
      background: transparent;
    }

    .footer-content {
      display: inline-block;
      padding: 20px 40px;
      border-top: 1px solid rgba(191, 149, 63, 0.3);
    }

    .footer-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
      margin: 5px 0;
    }

    .footer-sub {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Notícias</h1>
    <p class="page-subtitle">Informações de mercado do Brasil e do mundoem tempo real</p>
    <button class="refresh-btn" onclick="carregarNoticias()">🔄 Atualizar</button>
  </header>

  <main class="container">
    <div class="news-container" id="feed"></div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-text">Terminal Financeiro Day trade</div>
      <div class="footer-sub">© 2026 • Ricardo Campos - Trader & Holder</div>
    </div>
  </footer>

  <script>
    async function carregarNoticias() {
      const rssUrl = "https://www.infomoney.com.br/feed/";
      const container = document.getElementById("feed");
      
      try {
        container.innerHTML = "<p style='color: #ffffff; text-align: center; font-weight: bold; opacity: 0.7;'>Buscando notícias recentes...</p>"; 

        const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        const data = await response.json();

        container.innerHTML = ""; 

        data.items.forEach(item => {
          const div = document.createElement("div");
          div.className = "news-item";
          div.innerHTML = `
            <h2>${item.title}</h2>
            <p>📅 ${new Date(item.pubDate).toLocaleString("pt-BR")}</p>
            <a href="${item.link}" target="_blank">Leia mais →</a>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error("Erro ao carregar notícias:", error);
        container.innerHTML = "<p style='color: #ff4a4a; text-align: center; font-weight: bold;'>Erro ao atualizar o feed. Tente novamente.</p>";
      }
    }

    carregarNoticias();
  </script>
</body>
</html>
