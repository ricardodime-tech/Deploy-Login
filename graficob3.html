<!DOCTYPE html>

  <style>
    :root {
      /* Padrão de cores e bordas do arquivo original */
       --bg-top: #1a1d33; 
      --bg-bottom: #1a1d23;
      --card-inner-bg: #ffffff;
      --header-dark: #1a1d23; 
      --muted: #ffffff;
      --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
      background-repeat: no-repeat;
      background-color: var(--bg-bottom);
      font-family: system-ui, -apple-system, sans-serif;
    }

    header { padding: 45px 20px 25px; text-align: center; }

    .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px 32px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    /* Card com a mesma borda dourada e sombra do arquivo original */
    .card {
      position: relative;
      background: var(--gold-gradient);
      border-radius: var(--radius);
      padding: 3px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-8px); }

    .card-inner {
      background: var(--card-inner-bg);
      border-radius: calc(var(--radius) - 3px);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho do card idêntico ao arquivo grafico.html */
    .card-inner header {
      padding: 18px 15px;
      background: var(--header-dark);
      border-bottom: 2px solid #b38728; 
      text-align: center;
      box-shadow: inset 0 -5px 15px rgba(0,0,0,0.6);
    }

    .card-inner header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 0.8px #000;
    }

    /* Altura igualada para 480px conforme o arquivo original */
    .frame-wrap {
      width: 100%;
      height: 480px; 
      background: #000;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

   footer {
      padding: 80px 20px 40px;
      text-align: center;
      background: transparent;
    }

    .footer-content {
      display: inline-block;
      padding: 20px 40px;
      border-top: 1px solid rgba(191, 149, 63, 0.3);
    }

    .footer-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      /* Sombra fina e pequena para destaque */
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.2));
      margin: 5px 0;
    }

    .footer-sub {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 10px;
      opacity: 0.8;
    }

    a { 
      color: inherit; 
      text-decoration: none; 
      border-bottom: 1px solid #bf953f;
    }
    
    @media (max-width: 720px) {
      .frame-wrap { height: 380px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
