<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Mercado B3 — Black & Gold</title>
  
  <style>
    :root {
      /* Padrão de cores e bordas do arquivo original */
      --bg-top: #1a1d33; 
      --bg-bottom: #1a1d23;
      --card-inner-bg: #ffffff;
      --header-dark: #1a1d23; 
      --muted: #ffffff;
      --gold-gradient: linear-gradient(145deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 350px);
      background-repeat: no-repeat;
      background-color: var(--bg-bottom);
      font-family: system-ui, -apple-system, sans-serif;
    }

    header { padding: 45px 20px 25px; text-align: center; }

    .container { max-width: 1440px; margin: 0 auto; padding: 16px 20px 32px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
    }

    /* Card com a mesma borda dourada e sombra do arquivo original */
    .card {
      position: relative;
      background: var(--gold-gradient);
      border-radius: var(--radius);
      padding: 3px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-8px); }

    .card-inner {
      background: var(--card-inner-bg);
      border-radius: calc(var(--radius) - 3px);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative; /* Necessário para posicionar a lupa */
    }

    /* Cabeçalho do card idêntico ao arquivo grafico.html */
    .card-inner header {
      padding: 18px 15px;
      background: var(--header-dark);
      border-bottom: 2px solid #b38728; 
      text-align: center;
      box-shadow: inset 0 -5px 15px rgba(0,0,0,0.6);
    }

    .card-inner header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      -webkit-text-stroke: 0.8px #000;
    }

    /* Botão da Lupa no canto superior esquerdo */
    .btn-zoom {
      position: absolute;
      top: 15px;
      left: 15px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      transition: transform 0.2s ease;
    }
    
    .btn-zoom:hover {
      transform: scale(1.2);
    }

    /* Ícone de Lupa de Zoom (+) em CSS Puro */
    .icon-lupa-zoom {
      width: 15px;
      height: 15px;
      border: 2.5px solid #bf953f;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-lupa-zoom::after {
      content: '';
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 2.5px;
      height: 7px;
      background: #bf953f;
      transform: rotate(-45deg);
      border-radius: 1px;
    }
    .icon-lupa-zoom::before {
      content: '+';
      color: #bf953f;
      font-size: 14px;
      font-weight: 900;
      font-family: sans-serif;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
    }

    /* Altura igualada para 480px conforme o arquivo original */
    .frame-wrap {
      width: 100%;
      height: 480px; 
      background: #000;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }

    /* ---- Estilos da Janela Modal ---- */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto; 
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--gold-gradient);
      padding: 3px;
      border-radius: var(--radius);
      width: 806px; /* 800px do widget + 6px de bordas */
      max-width: 95%;
      box-shadow: 0 5px 30px rgba(0,0,0,0.5);
      animation: zoomIn 0.3s ease;
    }

    .modal-inner {
      background: var(--header-dark);
      border-radius: calc(var(--radius) - 3px);
      overflow: hidden;
    }

    .modal-header {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #b38728;
    }

    .modal-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .close-modal {
      color: #bf953f;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
      line-height: 20px;
    }

    .close-modal:hover {
      color: #fcf6ba;
    }

    .modal-body iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
      background: #ffffff;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

   footer {
      padding: 80px 20px 40px;
      text-align: center;
      background: transparent;
    }

    .footer-content {
      display: inline-block;
      padding: 20px 40px;
      border-top: 1px solid rgba(191, 149, 63, 0.3);
    }

    .footer-text {
      background: var(--gold-gradient);
      -webkit-background-clip: text;

      background-clip: text;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;

    }

    .footer-sub {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 10px;
      opacity: 0.8;
    }

    a { 
      color: inherit; 
      text-decoration: none; 
      border-bottom: 1px solid #bf953f;
    }
    
    @media (max-width: 720px) {
      .frame-wrap { height: 380px; }
      .grid { grid-template-columns: 1fr; }
      .modal-body iframe { height: 450px; }
    }
  </style>
</head>

  <script>
    const modal = document.getElementById('graphModal');
    const modalIframe = document.getElementById('modalIframe');
    const modalTitle = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('closeModal');
    const zoomButtons = document.querySelectorAll('.btn-zoom');

    zoomButtons.forEach(button => {
      button.addEventListener('click', function() {
        const cardInner = this.parentElement;
        const title = cardInner.querySelector('h2').innerText;
        
        // Coleta o ticker do ativo guardado no atributo 'data-symbol' do botão
        const symbol = this.getAttribute('data-symbol');
        
        // Constrói a URL do widget oficial do TradingView em formato iframe estável para a modal (800x600)
        const embedUrl = `https://s.tradingview.com/widgetembed/?frameElementId=tradingview_modal&symbol=${encodeURIComponent(symbol)}&interval=5&symboledit=0&saveimage=1&toolbarbg=f1f3f6&studies=%5B%22BB%40tv-basicstudies%22%2C%22SAR%40tv-basicstudies%22%5D&theme=light&style=1&timezone=Etc%2FUTC&studies_overrides=%7B%7D&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=pt&utm_source=localhost&utm_medium=widget&utm_campaign=chart&utm_term=${encodeURIComponent(symbol)}`;

        // Aplica e exibe identico ao primeiro arquivo
        modalTitle.innerText = title;
        modalIframe.setAttribute('src', embedUrl);
        modal.style.display = 'flex';
      });
    });

    // Função de fechamento limpo
    const closeModalWindow = () => {
      modal.style.display = 'none';
      modalIframe.setAttribute('src', '');
    };

    closeBtn.addEventListener('click', closeModalWindow);
    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModalWindow();
      }
    });
  </script>
